services:
  pusattokenai-mcp:
    build: .
    container_name: pusattokenai-mcp-server
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
